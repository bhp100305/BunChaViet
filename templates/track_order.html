<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theo dõi đơn hàng - Bún Chả Việt</title>


    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
    >


    <!-- CSS trang theo dõi -->

    <link
        rel="stylesheet"
        href="/static/css/track_order.css"
    >


    <!-- CSS chung -->

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >


    <!-- Leaflet -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        /* ================================
           BẢN ĐỒ
        ================================= */

        .active-map {
            width: 100%;
            height: 430px;
            margin-top: 20px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            background: #eeeeee;
        }


        #driver-map {
            width: 100%;
            height: 100%;
        }


        /* ================================
           MARKER SHIPPER
        ================================= */

        .driver-marker {

            width: 58px;
            height: 58px;

            border-radius: 50%;

            background: #8f0b24;

            border: 4px solid white;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.3);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 29px;

            position: relative;

            animation: driverPulse 1.8s infinite;

        }


        .driver-marker::after {

            content: "";

            position: absolute;

            bottom: -9px;

            left: 50%;

            transform: translateX(-50%);

            width: 0;

            height: 0;

            border-left: 9px solid transparent;

            border-right: 9px solid transparent;

            border-top: 12px solid #8f0b24;

        }


        @keyframes driverPulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }

        }


        /* ================================
           THÔNG TIN SHIPPER TRÊN MAP
        ================================= */

        .driver-popup {

            min-width: 190px;

            text-align: center;

            font-family: Roboto, sans-serif;

        }


        .driver-popup-avatar {

            width: 60px;

            height: 60px;

            border-radius: 50%;

            object-fit: cover;

            margin-bottom: 8px;

            border: 3px solid #8f0b24;

        }


        .driver-popup-name {

            font-size: 16px;

            font-weight: 700;

            color: #8f0b24;

            margin-bottom: 5px;

        }


        .driver-popup-status {

            color: #159447;

            font-weight: 600;

            font-size: 13px;

        }


        /* ================================
           HEADER BẢN ĐỒ
        ================================= */

        .map-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 12px;

        }


        .map-header h3 {

            margin: 0;

            color: #8f0b24;

        }


        .live-status {

            color: #159447;

            font-size: 14px;

            font-weight: 700;

        }


        .live-dot {

            display: inline-block;

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #16a34a;

            margin-right: 5px;

            animation: liveBlink 1.2s infinite;

        }


        @keyframes liveBlink {

            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }

        }


        /* ================================
           LOADING MAP
        ================================= */

        .map-loading {

            position: absolute;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: center;

            background: rgba(255, 255, 255, 0.85);

            font-size: 16px;

            color: #666;

        }


        .map-loading.hidden {

            display: none;

        }

    </style>

</head>


<body>


<header class="header">

    <div class="header-container">


        <div class="staff-login-left">

            <a
                href="/login"
                class="btn-staff-login"
            >
                🔑 Đăng nhập Nội bộ
            </a>

        </div>


        <div class="logo">

            <span class="logo-icon">
                🍜
            </span>


            <div class="logo-text">

                <span class="brand-name">
                    BÚN CHẢ VIỆT
                </span>


                <span class="brand-slogan">
                    Nhất sạch – nhì ngon
                </span>

            </div>

        </div>


        <nav>

            <a
                href="/"
                class="nav-link"
            >
                Trang chủ
            </a>


            <a
                href="/about"
                class="nav-link"
            >
                Giới thiệu
            </a>


            <a
                href="#contact"
                class="nav-link"
            >
                Liên hệ
            </a>


            <a
                href="/track-order"
                class="nav-link active"
            >
                Theo dõi đơn hàng
            </a>


            <button
                class="cart-btn"
                onclick="showCart()"
            >
                🛒 Giỏ hàng

                <span id="cart-count">
                    0
                </span>
            </button>

        </nav>

    </div>

</header>



<main class="container">


    <!-- ================================
         TRA CỨU
    ================================= -->

    <section class="search-box">

        <h2>
            🔎 Theo dõi đơn hàng
        </h2>


        <p>
            Nhập số điện thoại đặt hàng
        </p>


        <input
            id="phone"
            type="tel"
            placeholder="Nhập số điện thoại"
        >


        <button
            onclick="searchOrder()"
        >
            Tra cứu đơn hàng
        </button>

    </section>



    <!-- ================================
         KẾT QUẢ
    ================================= -->

    <section
        id="order-result"
        class="order-result"
    >

    </section>


</main>



<!-- Leaflet JS -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<!-- JS theo dõi -->

<script
    src="/static/js/track_order.js"
></script>


</body>

</html>
