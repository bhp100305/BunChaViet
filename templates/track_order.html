<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Theo dõi đơn hàng - Bún Chả Việt
    </title>


    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
    <script src="/static/js/customer-header.js" defer></script>


    <link
        rel="stylesheet"
        href="/static/css/track_order.css"
    >


    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>


<header class="header">


    <div class="header-container">


        <div class="staff-login-left">


            <a
                href="/login"
                class="btn-staff-login"
            >

                🔑 Đăng nhập Nội bộ

            </a>


        </div>



        <div class="logo">


            <span class="logo-icon">
                🍜
            </span>


            <div class="logo-text">


                <span class="brand-name">
                    BÚN CHẢ VIỆT
                </span>


                <span class="brand-slogan">
                    Nhất sạch – nhì ngon
                </span>


            </div>


        </div>



        <nav>


            <a
                href="/"
                class="nav-link"
            >
                Trang chủ
            </a>


            <a
                href="/about"
                class="nav-link"
            >
                Giới thiệu
            </a>


            <a
                href="/contact"
                class="nav-link"
            >
                Liên hệ
            </a>


            <a
                href="/track-order"
                class="nav-link active"
            >
                Theo dõi đơn hàng
            </a>

            <a href="/customer/login" class="nav-link customer-account-link">Đăng nhập</a>


            <button
                class="cart-btn"
                onclick="showCart()"
            >

                🛒 Giỏ hàng

                <span id="cart-count">
                    0
                </span>

            </button>


        </nav>


    </div>


</header>



<main class="container">


    <section class="search-box">


        <h2>
            🔎 Theo dõi đơn hàng
        </h2>


        <p>
            Nhập số điện thoại đã dùng khi đặt hàng
        </p>


        <div class="search-form">


            <input
                id="phone"
                type="tel"
                placeholder="Nhập số điện thoại"
                autocomplete="tel"
            >


            <button
                type="button"
                onclick="searchOrder()"
            >

                Tra cứu đơn hàng

            </button>


        </div>


    </section>



    <section
        id="order-result"
        class="order-result"
        aria-live="polite"
    >
    </section>


</main>



<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
>
</script>


<script
    src="/static/js/track_order.js"
>
</script>


</body>

</html>
