<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thanh toán - Bún Chả Việt</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/checkout.css">
</head>


<body>

<header class="checkout-header">

    <div class="header-content">

        <h1>
            🍜 BÚN CHẢ VIỆT
        </h1>

        <a href="/">
            ← Quay lại thực đơn
        </a>

    </div>

</header>



<main class="checkout-container">


    <!-- THÔNG TIN KHÁCH HÀNG -->

    <section class="customer-box">

        <h2>
            📍 Thông tin giao hàng
        </h2>


        <div class="form-group">

            <label>
                Họ và tên
            </label>

            <input 
                id="fullname"
                type="text"
                placeholder="Nhập họ tên">

        </div>



        <div class="form-group">

            <label>
                Số điện thoại
            </label>

            <input 
                id="phone"
                type="text"
                placeholder="Nhập số điện thoại">

        </div>



        <div class="address-grid">


            <div class="form-group">

                <label>
                    Tỉnh/Thành phố
                </label>

                <select id="province">

                    <option>
                        Chọn tỉnh/thành phố
                    </option>

                </select>

            </div>



            <div class="form-group">

                <label>
                    Quận/Huyện
                </label>

                <select id="district">

                    <option>
                        Chọn quận/huyện
                    </option>

                </select>

            </div>




            <div class="form-group">

                <label>
                    Phường/Xã
                </label>

                <select id="ward">

                    <option>
                        Chọn phường/xã
                    </option>

                </select>

            </div>


        </div>




        <div class="form-group">

            <label>
                Địa chỉ cụ thể
            </label>

            <textarea 
                id="address"
                placeholder="Ví dụ: Số 10, đường ABC">
            </textarea>

        </div>




        <div class="form-group">

            <label>
                Ghi chú
            </label>

            <textarea
                id="note"
                placeholder="Ví dụ: Giao giờ trưa, ít hành...">
            </textarea>

        </div>


    </section>





    <!-- ĐƠN HÀNG -->

    <section class="order-box">

        <h2>
            🛒 Đơn hàng của bạn
        </h2>


        <div id="checkout-items">

        </div>



        <div class="total">

            <span>
                Tổng tiền:
            </span>


            <strong id="checkout-total">
                0 ₫
            </strong>

        </div>




        <button 
            id="order-btn"
            class="order-btn">

            ĐẶT HÀNG

        </button>


    </section>


</main>



<script src="/static/js/checkout.js"></script>


</body>

</html>
