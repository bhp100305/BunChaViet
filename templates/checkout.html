<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>
        Thanh toán - Bún Chả Việt
    </title>


    <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">


    <link
    rel="stylesheet"
    href="/static/css/checkout.css">


    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css">

</head>



<body>



<header class="header">

    <div class="header-content">


        <h1>
            🍜 BÚN CHẢ VIỆT
        </h1>



        <a href="/">
            ← Quay lại thực đơn
        </a>


    </div>


</header>





<main class="checkout-container">



<section class="customer-box">


<h2>
    📍 Thông tin giao hàng
</h2>




<div class="form-group">


<label>
    Họ và tên
</label>


<input
id="fullname"
placeholder="Nhập họ tên">

</div>





<div class="form-group">


<label>
    Số điện thoại
</label>


<input
id="phone"
placeholder="Nhập số điện thoại">

</div>





<div class="form-group">


<label>
    Địa chỉ giao hàng
</label>



<div class="address-search">


<input
id="address"
placeholder="Nhập địa chỉ giao hàng..."
autocomplete="off">



<button
id="search-location"
type="button">

🔎

</button>


<div id="suggestions"></div>


</div>





<button
class="current-btn"
id="current-location"
type="button">

📍 Dùng vị trí hiện tại

</button>


</div>





<div id="map"></div>



<input
type="hidden"
id="latitude">


<input
type="hidden"
id="longitude">





<div class="form-group">


<label>
    Ghi chú
</label>


<textarea
id="note"
placeholder="Ví dụ: Giao giờ trưa, ít hành...">
</textarea>


</div>




</section>






<section class="order-box">



<h2>
    🛒 Đơn hàng của bạn
</h2>




<div id="checkout-items"></div>





<div class="summary">



<div>

<span>
Tiền món:
</span>


<strong id="food-total">
0 ₫
</strong>


</div>





<div>

<span>
Khoảng cách:
</span>


<strong id="distance">
0 km
</strong>


</div>





<div>

<span>
Phí giao hàng:
</span>


<strong id="shipping-fee">
0 ₫
</strong>


</div>






<div class="final-total">


<span>
Tổng tiền:
</span>


<strong id="checkout-total">
0 ₫
</strong>


</div>



</div>






<button
id="order-btn"
class="order-btn">

ĐẶT HÀNG

</button>



</section>




</main>






<script
src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>



<script
src="/static/js/checkout.js">
</script>



</body>

</html>
