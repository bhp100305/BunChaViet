
[project]
name = "nguonmo"
version = "0.1.0"
description = "Bun Cha Viet - Flask Web Application"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3,<4",
    "gunicorn>=23,<24",
    "psycopg[binary]==3.3.8",
    "python-dotenv>=1.0,<2",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
]

[dependency-groups]
# `uv sync` keeps SQL Server support for local development.
local = ["pyodbc>=5.3,<6"]

[tool.uv]
default-groups = ["local"]
